[package]
name = "helio-mc-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Core engine for Helio, a terminal Minecraft launcher. All logic, no terminal output."
repository = "https://github.com/baric/Helio"

[build-dependencies]

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
    "gzip",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "5"
uuid = { version = "1", features = ["v4", "serde"] }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
url = { version = "2", features = ["serde"] }
keyring = "3"
chrono = { version = "0.4", features = ["serde"] }
zip = { version = "2", default-features = false }
walkdir = "2"
tokio-util = "0.7"
futures = "0.3"
sysinfo = "0.33"
aes-gcm = "0.10"
unicode-width = "0.2"
flate2 = "1"
crc32fast = "1"

[dev-dependencies]
tokio-test = "0.4"
