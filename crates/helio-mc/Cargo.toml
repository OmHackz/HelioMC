[package]
name = "helio-mc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Helio: a terminal Minecraft launcher. One command, helio, for everything."
repository = "https://github.com/baric/Helio"

[[bin]]
name = "helio"
path = "src/main.rs"

[dependencies]
helio-mc-core = { path = "../helio-mc-core" }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indicatif = "0.17"
dialoguer = "0.11"
rpassword = "7"
comfy-table = "7"
owo-colors = "4"
tracing = "0.1"
tracing-subscriber = "0.3"
console = "0.16"
unicode-width = "0.2"
mc-launcher-core = "0.1.2"
ctrlc = "3.4"
atty = "0.2"
